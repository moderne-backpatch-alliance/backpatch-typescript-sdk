    note: "Carried from 1.29.1-backpatch-00002; upstream's fix in 1.32.0. It closes the advisory: MCP TypeScript SDK: Experimental tasks were not tied to the session that created them."
  - cve: CVE-2026-111768
    upstream_fix_url: https://github.com/modelcontextprotocol/typescript-sdk/commit/fd26801b3b387742fe24a90ed4b275dd6072209f
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-111768
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-typescript-sdk/compare/7e7062c~1...49601cc
    basis: backport
    artifacts:
      - "@modelcontextprotocol/sdk"
    note: "Carried from 1.29.1-backpatch-00003; upstream's fix in 1.32.0. It closes the advisory: MCP TypeScript SDK: One HTTP request within the default size limit could exhaust server memory during validation."
  - cve: CVE-2026-111771
    upstream_fix_url: https://github.com/modelcontextprotocol/typescript-sdk/commit/5a0724d14cf34a27a3b070224d2996cdd611df9f
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-111771
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-typescript-sdk/commit/b08f274
    basis: backport
    artifacts:
      - "@modelcontextprotocol/sdk"
    note: "Carried from 1.29.1-backpatch-00004; upstream's fix in 1.32.0. It closes the advisory: MCP TypeScript SDK: Server bearer authentication accepted tokens issued for another service."
  - cve: CVE-2026-111769
    upstream_fix_url: https://github.com/modelcontextprotocol/typescript-sdk/commit/30bfe5139f4b0825c90cd725f9a7e3f9af5e120d
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-111769
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-typescript-sdk/commit/09daa3b
    basis: adapted
    artifacts:
      - "@modelcontextprotocol/sdk"
    note: "New in this release; upstream's fix in 1.32.0, adapted to 1.29.0. It closes the advisory: MCP TypeScript client SDK: HTTP client transports and OAuth requests followed cross-origin redirects and re-sent custom headers and request bodies. Since this release the client transports and the OAuth requests of @modelcontextprotocol/sdk follow a redirect only within the request's origin, and no longer follow a 301, 302 or 303 answer to a POST: an application whose MCP server, authorization server or metadata endpoint redirects to another origin, or redirects a POST, now gets the redirect response instead of the redirected one and its request fails. In browsers any request that is answered with a redirect now fails, because a manual redirect response is opaque there. This is upstream's fix as upstream shipped it."
